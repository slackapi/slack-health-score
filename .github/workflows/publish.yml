name: Publish

on:
  release:
    types: [published, edited]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Install deps
        run: npm ci
      - name: Build Action
        run: npm run build
      - name: Commit the build and move the release tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Commit all of dist/, not only dist/index.js. The build also writes
          # code-split chunks, a source map loader, and a package.json that the
          # action needs at runtime.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force action.yml dist
          git commit --message "Automatic compilation"
          tags=("$TAG_NAME")
          if [ "$PRERELEASE" != "true" ]; then
            tags+=("${TAG_NAME%.*}" "${TAG_NAME%%.*}")
          fi
          for tag in "${tags[@]}"; do
            git tag --force "$tag"
          done
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${tags[@]/#/refs/tags/}"
